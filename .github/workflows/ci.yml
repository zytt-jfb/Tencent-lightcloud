name: ci

# 提交/PR 卡点：迁移文件一致性、类型检查、全量构建。
# 部署走 Gitee -> 服务器，但代码同时托管在 GitHub，PR 与推送都能在这里被拦住。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 拆成独立 step：失败时能一眼看出是迁移校验、类型检查还是打包出的问题。
      # 与 scripts/ci/verify.sh 执行同一批命令，保持本地与 CI 行为一致。
      - name: 迁移文件一致性
        run: pnpm migration-files:check

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建 shared-types
        run: pnpm --filter @biz-reporting/shared-types build

      - name: 构建 shared-constants
        run: pnpm --filter @biz-reporting/shared-constants build

      - name: 构建 API
        run: pnpm --filter api build

      - name: 构建前端
        run: pnpm --filter admin-web build
