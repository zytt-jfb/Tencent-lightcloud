name: build-image

# 用 GitHub 自带的容器镜像仓库 ghcr.io 构建并推送镜像 —— 无需配置任何 Secrets，
# workflow 内置的 GITHUB_TOKEN 即可完成登录与推送。
#
# 首次推送后，包默认是 private。若希望服务器免登录拉取，请在
# https://github.com/users/<owner>/packages 把两个包改为 public（代码本就在公开仓库）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像 tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 API 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/biz-reporting-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/biz-reporting-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/ecs/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/biz-reporting-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/biz-reporting-frontend:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: 输出部署命令
        run: |
          echo "### 构建完成，镜像 tag: \`${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> 首次推送的包默认为 private。若服务器拉取报 unauthorized，请到 Packages 设置把包改为 public。" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "cd /home/ubuntu/zy/zy_data && sudo git pull --ff-only" >> "$GITHUB_STEP_SUMMARY"
          echo "sudo API_IMAGE=ghcr.io/${{ github.repository_owner }}/biz-reporting-api:${{ steps.meta.outputs.tag }} \\" >> "$GITHUB_STEP_SUMMARY"
          echo "     WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/biz-reporting-frontend:${{ steps.meta.outputs.tag }} \\" >> "$GITHUB_STEP_SUMMARY"
          echo "     bash deploy/ecs/biz-deploy.sh --pull-only" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
