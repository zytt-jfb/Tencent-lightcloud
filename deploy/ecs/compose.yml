name: biz-reporting

# 阿里云 ECS 部署编排（最纯净版）
# 服务: mysql(数据库) + api(后端) + frontend(Nginx 静态站+反代) + migrate(一次性建表/迁移)
# 移除原 NAS 版的 Nginx Proxy Manager 与 Cloudflare 隧道。
# 2026-10-15 更新：在实例本地由 frontend 容器终止 HTTPS（443），80 仅用于 ACME 与 301 跳转。

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT in .env}/mysql/data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/biz-reporting.cnf:ro
    networks:
      - biz_db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 实测：MySQL 曾以 506MiB/512MiB 顶格运行（98.9%）并开始换页，而 api 实际仅用 ~83MiB。
    # 注意 mem_limit 是上限而非预留：调低 api 不会释放物理内存，反而会压缩 Node heap 上限，
    # 因此这里只把 MySQL 提到 768m（buffer pool 512m + 连接/临时表余量），api/frontend 维持原值。
    mem_limit: 768m
    cpus: 1.0

  # 一次性服务：首次启动执行数据库迁移（建表/增量），由 --profile init 触发。
  migrate:
    build:
      context: ../..
      dockerfile: deploy/ecs/migrate.Dockerfile
    profiles: ["init"]
    environment:
      NODE_ENV: production
      DEPLOY_ENV: production
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      DB_SYNC: "false"
      MIGRATION_APPROVED: "true"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - biz_db

  api:
    # 默认沿用本机构建出的镜像名；CI 构建模式下由 API_IMAGE 注入仓库地址
    image: ${API_IMAGE:-biz-reporting-api:migration-20261015}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      # 关键：容器默认 UTC。快照定时任务按进程本地时区解释 "03:00"，
      # 未设置时区时会变成 UTC 03:00 = 北京时间 11:00（线上实际表现）。
      TZ: Asia/Shanghai
      NODE_ENV: production
      DEPLOY_ENV: production
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      DB_POOL_CONNECTION_LIMIT: ${DB_POOL_CONNECTION_LIMIT:-8}
      DB_POOL_QUEUE_LIMIT: ${DB_POOL_QUEUE_LIMIT:-100}
      DB_SYNC: "false"
      DB_LOGGING: ${DB_LOGGING:-false}
      FACT_SOURCE_STORAGE_ROOT: /tmp/biz-reporting-source-files
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_ISSUER: ${JWT_ISSUER:-biz-reporting-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-biz-reporting-clients}
      AUTH_SECURITY_HMAC_KEY: ${AUTH_SECURITY_HMAC_KEY:?set AUTH_SECURITY_HMAC_KEY in .env}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_RATE_LIMIT_IP_MAX: ${AUTH_RATE_LIMIT_IP_MAX:-5}
      AUTH_ACCOUNT_WINDOW_MS: ${AUTH_ACCOUNT_WINDOW_MS:-900000}
      AUTH_ACCOUNT_MAX_FAILURES: ${AUTH_ACCOUNT_MAX_FAILURES:-5}
      AUTH_ACCOUNT_BLOCK_MS: ${AUTH_ACCOUNT_BLOCK_MS:-900000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      READINESS_CACHE_MS: ${READINESS_CACHE_MS:-5000}
      READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-2000}
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
    volumes:
      - ${DATA_ROOT}/source-files:/tmp/biz-reporting-source-files
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - biz_edge
      - biz_db
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/live >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 512m
    cpus: 0.8

  frontend:
    # 默认沿用本机构建出的镜像名；CI 构建模式下由 WEB_IMAGE 注入仓库地址
    image: ${WEB_IMAGE:-biz-reporting-frontend}
    build:
      context: ../..
      dockerfile: deploy/ecs/frontend.Dockerfile
    restart: unless-stopped
    # 前端直出 80/443；实例本地终止 HTTPS，80 仅用于 ACME 与 301 跳转。
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /data/biz-reporting/acme-webroot:/var/www/acme
    depends_on:
      api:
        condition: service_healthy
    networks:
      - biz_edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

networks:
  biz_edge:
    name: biz-reporting_edge
    driver: bridge
  biz_db:
    name: biz-reporting_db
    driver: bridge
    internal: true
